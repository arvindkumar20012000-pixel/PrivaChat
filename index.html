<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
    <script>
      // Suppress Vite HMR WebSocket connection closed errors in AI Studio preview iframe
      window.addEventListener('error', function(event) {
        if (event && (
          (event.message && (event.message.includes('WebSocket') || event.message.includes('vite'))) ||
          (event.filename && event.filename.includes('@vite/client'))
        )) {
          event.stopImmediatePropagation();
          event.preventDefault();
          return true;
        }
      }, true);
      window.addEventListener('unhandledrejection', function(event) {
        if (event && event.reason && (
          (typeof event.reason.message === 'string' && (event.reason.message.includes('WebSocket') || event.reason.message.includes('vite'))) ||
          (typeof event.reason === 'string' && event.reason.includes('WebSocket'))
        )) {
          event.stopImmediatePropagation();
          event.preventDefault();
        }
      }, true);
    </script>
    <title>SecretCouples - End-to-End Encrypted Private Chat</title>
    <meta name="description" content="Ultra-private, end-to-end encrypted couple chat app with photo/video sharing, self-destructing messages, stealth calculator disguise, and instant message deletion." />
