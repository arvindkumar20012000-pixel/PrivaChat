
<!DOCTYPE html>
<html>
<head><style>body { margin: 0; background: transparent; }</style></head>
<body>
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="roseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="210" fill="none" stroke="#f43f5e" stroke-width="6" stroke-opacity="0.3"/>
  <!-- Glowing Heart Lock -->
  <g filter="url(#glow)">
    <!-- Lock shackle -->
    <path d="M196 210 V160 C196 126.8 222.8 100 256 100 C289.2 100 316 126.8 316 160 V210" fill="none" stroke="#fda4af" stroke-width="26" stroke-linecap="round"/>
    <!-- Lock body in shape of shield-heart -->
    <rect x="160" y="210" width="192" height="170" rx="36" fill="url(#roseGrad)"/>
    <!-- Keyhole -->
    <circle cx="256" cy="280" r="18" fill="#0f172a"/>
    <polygon points="248,280 264,280 268,324 244,324" fill="#0f172a"/>
    <circle cx="256" cy="280" r="8" fill="#fda4af"/>
  </g>
</svg>

</body>
</html>
